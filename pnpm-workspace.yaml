# pnpm 11 reads the build-script allowlist here (no longer package.json).
# Allow native postinstall builds for trusted deps only.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  # esbuild downloads its platform binary; required by Orval's config loader.
  esbuild: true
  # Optional native msgpack accelerator for BullMQ; JS fallback is fine.
  msgpackr-extract: false
  # Install-time analytics phone-home; keep disabled.
  '@scarf/scarf': false
  # Chromium download for mermaid-cli; not needed — ERD outputs Markdown.
  puppeteer: false

overrides:
  multer: ^2.2.0
  '@fastify/static': '>=10.1.1'
  brace-expansion: '>=5.0.9'
  'brace-expansion@1': '>=5.0.9'
  'brace-expansion@2': '>=5.0.9'
  'brace-expansion@5': '>=5.0.9'
  minimatch: '>=5.1.6'
  'minimatch@3': '>=5.1.6'
  fast-uri: '>=4.1.2'
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  find-my-way: '>=9.7.0'
  uuid: ^11.1.1
  'js-yaml@4': ^4.3.1
  'js-yaml': ^4.3.1
  deepmerge-ts: ^8.0.0
  '@prisma/config>deepmerge-ts': ^8.0.0
